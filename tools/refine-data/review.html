<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>real-v2 review</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f5bd3; --ok: #1f7a4a; --fix: #a86400; --drop: #b3261e;
  --del-bg: #fbe3e1; --del-ink: #8c1d16; --ins-bg: #ddf3e4; --ins-ink: #145a33;
  --chip: #efeee9; --sel: #e8eefc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
    --accent: #8aa8ff; --ok: #5cc68b; --fix: #f0a640; --drop: #ff8a80;
    --del-bg: #4a2220; --del-ink: #ffc1bb; --ins-bg: #1d3b29; --ins-ink: #b6f0c9;
    --chip: #2a2a27; --sel: #25304a;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
  --accent: #8aa8ff; --ok: #5cc68b; --fix: #f0a640; --drop: #ff8a80;
  --del-bg: #4a2220; --del-ink: #ffc1bb; --ins-bg: #1d3b29; --ins-ink: #b6f0c9;
  --chip: #2a2a27; --sel: #25304a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
label.btn, button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover, label.btn:hover { border-color: var(--accent); }
input[type=file] { display: none; }
select, input[type=search] { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.stat { color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 54px); }
#list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 54px); position: sticky; top: 54px; }
#list .item { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
#list .item.cur { background: var(--sel); }
#list .item .id { font-family: ui-monospace, Consolas, monospace; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--line); }
.dot.accept { background: var(--ok); } .dot.fix_clean { background: var(--fix); } .dot.drop { background: var(--drop); }
.sev { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); }
.sev.suspect { color: var(--drop); } .sev.check { color: var(--fix); }
#detail { padding: 16px 20px 80px; max-width: 1200px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--chip); border-radius: 6px; padding: 1px 8px; font-size: 12.5px; color: var(--muted); }
.chip b { color: var(--ink); font-weight: 600; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.card h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.text { white-space: pre-wrap; word-wrap: break-word; }
.diff { margin-top: 12px; }
.diff del { background: var(--del-bg); color: var(--del-ink); text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
.diff ins { background: var(--ins-bg); color: var(--ins-ink); text-decoration: none; border-radius: 3px; padding: 0 2px; }
.hints { margin-top: 12px; font-size: 13.5px; }
.hints code { font-family: ui-monospace, Consolas, monospace; background: var(--chip); padding: 0 4px; border-radius: 4px; }
.decide { margin-top: 14px; display: grid; gap: 8px; }
.decide .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.decide button.on.accept { background: var(--ok); color: #fff; border-color: var(--ok); }
.decide button.on.fix_clean { background: var(--fix); color: #fff; border-color: var(--fix); }
.decide button.on.drop { background: var(--drop); color: #fff; border-color: var(--drop); }
textarea, input.note { font: inherit; width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
textarea { min-height: 90px; }
audio { width: 100%; margin-top: 10px; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
.audit-other { font-size: 13px; color: var(--muted); }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  #list { position: static; max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .cols { grid-template-columns: 1fr; }
  #detail { padding: 12px 16px 60px; }
}
</style>
</head>
<body>
<header>
  <h1>real-v2 review</h1>
  <label class="btn">Open JSONL<input type="file" id="fileIn" accept=".jsonl,.json,.txt"></label>
  <label class="btn" title="Pick training/refine/data/audio-v2/heard if audio does not play directly">Audio folder<input type="file" id="dirIn" webkitdirectory directory multiple></label>
  <label class="btn">Import decisions<input type="file" id="decIn" accept=".jsonl"></label>
  <button id="exportBtn">Export decisions</button>
  <select id="filter">
    <option value="all">all rows</option>
    <option value="todo">undecided</option>
    <option value="suspect">auto: suspect</option>
    <option value="check">auto: check</option>
    <option value="conflict">audit conflicts</option>
    <option value="decided">decided</option>
  </select>
  <input type="search" id="search" placeholder="search id / text">
  <span class="stat" id="stat">no file loaded</span>
  <span class="kbd">j/k next/prev · a accept · f fix · d drop · p play</span>
</header>
<main>
  <nav id="list"></nav>
  <section id="detail"><div class="empty">Open a real-v2 <code>W*.jsonl</code>, an audit batch, or a conflicts file.<br>Audio plays from <code>training/refine/data/audio-v2/heard/</code> when this page is opened from <code>tools/refine-data/</code>; otherwise choose that folder with “Audio folder”.</div></section>
</main>
<script>
"use strict";
const S = { rows: [], idx: 0, file: "", dec: {}, audio: {}, view: [] };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

function normalize(o) {
  // real-v2 row | audit batch row ({kind:"row"}) | conflicts row ({id, a, b, row})
  if (o.kind === "header") return null;
  if (o.row && (o.a || o.b)) return { ...o.row, _conflict: { why: o.why, a: o.a, b: o.b } };
  if (o.kind === "row") return { ...o, audit: { auto: o.audit_auto } };
  return o;
}
function parseJsonl(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    try { const r = normalize(JSON.parse(line)); if (r && r.id) out.push(r); } catch {}
  }
  return out;
}
$("fileIn").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  S.rows = parseJsonl(await f.text()); S.file = f.name; S.idx = 0;
  S.dec = store.get("owf-review:" + S.file) || {};
  render();
});
$("dirIn").addEventListener("change", (e) => {
  for (const f of e.target.files) S.audio[f.name.replace(/\.(flac|wav|ogg|mp3)$/i, "")] = URL.createObjectURL(f);
  render();
});
$("decIn").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  for (const line of (await f.text()).split(/\r?\n/)) {
    try { const d = JSON.parse(line); if (d.id) S.dec[d.id] = d; } catch {}
  }
  save(); render();
});
$("exportBtn").addEventListener("click", () => {
  const ids = S.rows.map((r) => r.id).filter((id) => S.dec[id] && S.dec[id].decision);
  const body = ids.map((id) => {
    const d = S.dec[id]; const o = { id, decision: d.decision };
    if (d.decision === "fix_clean") o.clean = d.clean;
    if (d.note) o.note = d.note;
    return JSON.stringify(o);
  }).join("\n") + (ids.length ? "\n" : "");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type: "application/jsonl" }));
  a.download = (S.file || "review").replace(/\.jsonl$/, "") + ".human.jsonl";
  a.click();
});
$("filter").addEventListener("change", () => { S.idx = 0; render(); });
$("search").addEventListener("input", () => { S.idx = 0; render(); });

function save() { if (S.file) store.set("owf-review:" + S.file, S.dec); }

function visible() {
  const f = $("filter").value, q = $("search").value.trim().toLowerCase();
  return S.rows.filter((r) => {
    const d = S.dec[r.id], sev = r.audit?.auto?.severity;
    if (f === "todo" && d?.decision) return false;
    if (f === "decided" && !d?.decision) return false;
    if ((f === "suspect" || f === "check") && sev !== f) return false;
    if (f === "conflict" && !r._conflict) return false;
    if (q && !(r.id + " " + r.spoken + " " + r.raw + " " + r.clean).toLowerCase().includes(q)) return false;
    return true;
  });
}

// word-level diff (LCS over whitespace tokens; punctuation and case count as changes)
function diff(a, b) {
  const A = a.split(/(\s+)/).filter((t) => t.trim()), B = b.split(/(\s+)/).filter((t) => t.trim());
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push(esc(A[i])); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push("<del>" + esc(A[i++]) + "</del>");
    else out.push("<ins>" + esc(B[j++]) + "</ins>");
  }
  while (i < n) out.push("<del>" + esc(A[i++]) + "</del>");
  while (j < m) out.push("<ins>" + esc(B[j++]) + "</ins>");
  return out.join(" ");
}

function audioSrc(r) {
  if (S.audio[r.id]) return S.audio[r.id];
  if (r.audio_file) return "../../" + r.audio_file;  // page lives in tools/refine-data/
  return "";
}

function cond(c) {
  if (!c) return ""; if (typeof c === "string") return c;
  if (c.clean) return "clean";
  const p = [];
  if (c.rir) p.push("room " + c.rir.file);
  if (c.noise) p.push("noise " + c.noise.snr_db + " dB");
  if (c.mic && c.mic.type !== "none") p.push(c.mic.type + " mic");
  if (c.speed) p.push("speed " + c.speed);
  if (c.clipped_db) p.push("clipped");
  return p.join(", ") || "level only";
}

function render() {
  S.view = visible();
  const nDec = S.rows.filter((r) => S.dec[r.id]?.decision).length;
  $("stat").textContent = S.rows.length ? `${S.file}: ${S.view.length} shown / ${S.rows.length} rows, ${nDec} decided` : "no file loaded";
  $("list").innerHTML = S.view.map((r, k) => {
    const d = S.dec[r.id]?.decision || "", sev = r.audit?.auto?.severity || "";
    return `<div class="item ${k === S.idx ? "cur" : ""}" data-k="${k}"><span class="dot ${d}"></span><span class="id">${esc(r.id)}</span><span class="sev ${sev}">${esc(sev)}</span></div>`;
  }).join("");
  for (const el of $("list").querySelectorAll(".item")) el.onclick = () => { S.idx = +el.dataset.k; render(); };
  const cur = $("list").querySelector(".cur"); if (cur) cur.scrollIntoView({ block: "nearest" });
  const r = S.view[S.idx];
  if (!r) { if (S.rows.length) $("detail").innerHTML = '<div class="empty">No rows match.</div>'; return; }
  const d = S.dec[r.id] || {}, a = r.audit?.auto || {};
  const other = [];
  if (r.audit?.claude) other.push(`Claude audit: <b>${esc(r.audit.claude.decision)}</b> ${esc((r.audit.claude.reasons || []).join(", "))}`);
  if (r._conflict) {
    const f = (x) => x ? `<b>${esc(x.decision)}</b> ${esc(x.reason || "")}${x.clean ? ": “" + esc(x.clean) + "”" : ""}${x.note ? " (" + esc(x.note) + ")" : ""}` : "missing";
    other.push(`Conflict (${esc(r._conflict.why)}): A ${f(r._conflict.a)} · B ${f(r._conflict.b)}`);
  }
  const src = audioSrc(r);
  $("detail").innerHTML = `
    <div class="meta">
      <span class="chip"><b>${esc(r.id)}</b></span>
      <span class="chip">context <b>${esc(r.context)}</b></span>
      ${r.style ? `<span class="chip">style <b>${esc(r.style)}</b></span>` : ""}
      ${(r.dictionary || []).length ? `<span class="chip">dictionary <b>${esc(r.dictionary.join(", "))}</b></span>` : ""}
      <span class="chip">engine <b>${esc(r.raw_engine || "")}</b></span>
      <span class="chip">voice <b>${esc(r.voice || "")}</b></span>
      <span class="chip">audio <b>${esc(cond(r.audio_conditions))}</b></span>
      ${(r.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
    </div>
    <div class="cols">
      <div class="card"><h3>spoken (what was said)</h3><div class="text">${esc(r.spoken)}</div></div>
      <div class="card"><h3>raw (model input)</h3><div class="text">${esc(r.raw)}</div></div>
      <div class="card"><h3>clean (target)</h3><div class="text">${esc(r.clean)}</div></div>
    </div>
    ${src ? `<audio id="player" controls preload="none" src="${esc(src)}"></audio>` : ""}
    <div class="card diff"><h3>raw → clean, word diff</h3><div class="text">${diff(r.raw || "", r.clean || "")}</div></div>
    <div class="hints">
      auto audit: <b>${esc(a.severity || "-")}</b> · WER vs spoken <code>${a.wer ?? "-"}</code>
      ${(a.missing || []).length ? ` · said but missing from raw: ${a.missing.map((m) => `<code>${esc(m.token)}</code> (${esc(m.kind)})`).join(" ")}` : ""}
      ${(a.not_in_spoken || []).length ? ` · not in spoken: ${a.not_in_spoken.map((m) => `<code>${esc(m.token)}</code>`).join(" ")}` : ""}
      ${(a.flags || []).length ? ` · flags: ${a.flags.map((f) => `<code>${esc(f)}</code>`).join(" ")}` : ""}
      ${r.raw_asr && r.raw_asr !== r.raw ? `<div>before hesitation strip: <code>${esc(r.raw_asr)}</code></div>` : ""}
      ${other.length ? `<div class="audit-other">${other.join("<br>")}</div>` : ""}
    </div>
    <div class="decide">
      <div class="row">
        <button class="accept ${d.decision === "accept" ? "on" : ""}" data-d="accept">Accept (a)</button>
        <button class="fix_clean ${d.decision === "fix_clean" ? "on" : ""}" data-d="fix_clean">Fix clean (f)</button>
        <button class="drop ${d.decision === "drop" ? "on" : ""}" data-d="drop">Drop (d)</button>
        <button data-d="">Clear</button>
      </div>
      <textarea id="fixText" placeholder="corrected clean (for Fix)" ${d.decision === "fix_clean" ? "" : "hidden"}>${esc(d.clean ?? r.clean)}</textarea>
      <input class="note" id="note" placeholder="note / drop reason" value="${esc(d.note || "")}">
    </div>`;
  for (const b of $("detail").querySelectorAll(".decide button")) b.onclick = () => decide(b.dataset.d);
  $("fixText").oninput = (e) => { const x = S.dec[r.id] || (S.dec[r.id] = {}); x.clean = e.target.value; save(); };
  $("note").oninput = (e) => { const x = S.dec[r.id] || (S.dec[r.id] = {}); x.note = e.target.value; save(); };
}

function decide(kind) {
  const r = S.view[S.idx]; if (!r) return;
  const x = S.dec[r.id] || (S.dec[r.id] = {});
  x.decision = kind || undefined;
  if (kind === "fix_clean" && x.clean == null) x.clean = r.clean;
  save(); render();
  if (kind === "fix_clean") { const t = $("fixText"); t.hidden = false; t.focus(); }
}

document.addEventListener("keydown", (e) => {
  if (e.target.matches("textarea, input")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "j") { S.idx = Math.min(S.view.length - 1, S.idx + 1); render(); }
  else if (e.key === "k") { S.idx = Math.max(0, S.idx - 1); render(); }
  else if (e.key === "a") decide("accept");
  else if (e.key === "f") { e.preventDefault(); decide("fix_clean"); }
  else if (e.key === "d") decide("drop");
  else if (e.key === "p") { const p = $("player"); if (p) p.paused ? p.play() : p.pause(); }
});
</script>
</body>
</html>
