[package]
name = "ochre-cloud"
version = "0.1.0"
edition = "2024"
description = "Ochre BYOK cloud speech-to-text engines (Soniox, Deepgram, OpenAI, Groq, ElevenLabs, AssemblyAI)"

[dependencies]
ochre-core = { path = "../ochre-core" }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
tracing = "0.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[[example]]
name = "cloud_smoke"
