[package]
name = "ochre-wake"
description = "Hands-free mode: streaming wake word detector, control phrases and the session controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ochre-core = { version = "0.1.0", path = "../ochre-core" }
ort = "=2.0.0-rc.13"
regex = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
tracing = "0.1.44"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
cpal = "0.16"
