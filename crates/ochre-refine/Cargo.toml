[package]
name = "ochre-refine"
version = "0.1.0"
edition = "2024"
description = "Ochre refinement: prompts, guard, normalize, local Quill (llama-server sidecar) and cloud LLMs"

[dependencies]
ochre-core = { path = "../ochre-core" }
ochre-models = { path = "../ochre-models" }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
# DXGI adapter memory for the "auto" refine model pick (local/auto.rs).
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[example]]
name = "bench"
