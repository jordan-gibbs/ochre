<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD preview · Ochre</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="hud.css">
<style>
  /* preview chrome only; the HUD itself is hud.css */
  html, body { margin: 0; background: var(--bg); }
  body { padding: 24px; display: grid; gap: 18px; justify-content: center; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 1540px; }
  .bar h1 { font: var(--weight-display) 26px/1 var(--font-display); letter-spacing: var(--tracking-display); margin: 0 14px 0 0; }
  .bar h1 em { color: var(--accent-ink); }
  .bar button {
    font: var(--weight-medium) 12.5px/1 var(--font-sans); color: var(--ink-2); background: var(--panel);
    border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 11px; cursor: pointer;
    transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
  }
  .bar button:hover { color: var(--ink); }
  .bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .bar .sep { flex: 1; }
  .row { display: grid; grid-template-columns: repeat(2, 760px); gap: 16px; }
  .row-label { font: var(--weight-semibold) 11px/1 var(--font-sans); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--ink-3); margin: 14px 0 0; }
  .desk {
    position: relative; height: 300px; border-radius: 14px; overflow: hidden;
    background: #ede9e3; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .desk[data-theme="dark"] { background: #1b1a18; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  /* a stand-in app under the HUD: a document on the light desk, an editor on the dark one */
  .desk .doc { position: absolute; inset: 22px 60px 0; border-radius: 10px 10px 0 0; background: #fff; box-shadow: 0 1px 3px rgba(20,16,12,.07); padding: 28px 40px; }
  .desk[data-theme="dark"] .doc { background: #242220; box-shadow: none; }
  .desk .doc i { display: block; height: 9px; border-radius: 5px; background: #ece8e2; margin: 0 0 14px; }
  .desk[data-theme="dark"] .doc i { background: #35322d; }
  .desk .doc i:nth-child(3n) { width: 72%; }
  .desk .doc i:nth-child(4n+1) { width: 88%; }
  .desk .doc i.h { height: 14px; width: 34%; background: #ddd7cf; margin-bottom: 20px; }
  .desk[data-theme="dark"] .doc i.h { background: #48433d; }
  .desk .hud { bottom: 30px; }
  body.shot { padding: 0; gap: 0; }
  body.shot .bar, body.shot .row-label { display: none; }
  body.shot .row { gap: 0; }
  body.shot .desk { border-radius: 0; box-shadow: none; }
  body.grid .row { margin-bottom: 4px; }
  @media (max-width: 1500px) { body:not(.shot) .row { grid-template-columns: 760px; } }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <h1>HUD states</h1>
  </div>
  <div id="rows"></div>

<template id="hud-tpl">
  <!-- ======================== HUD markup contract (see docs/design.md) ======================== -->
  <div class="hud" data-state="idle" aria-live="polite">
    <div class="hud-bubble" hidden>
      <div class="hud-bubble-scroll"><p class="hud-bubble-text" style="margin:0"><span class="hud-final"></span><span class="hud-pending"></span><span class="hud-bubble-caret" aria-hidden="true"></span></p></div>
    </div>
    <div class="hud-pip">Say “transcribe”</div>
    <div class="hud-pill" role="status">
      <span class="hud-halo" aria-hidden="true"></span>
      <span class="hud-glyph" aria-hidden="true">
        <span class="hud-o"><svg class="hud-o-glyph" viewBox="0 0 100 100"><path d="M50.1 81.2Q40.2 81.2 32.8 77.35Q25.4 73.5 21.35 66.45Q17.3 59.4 17.3 49.9Q17.3 40.4 21.35 33.4Q25.4 26.4 32.8 22.6Q40.2 18.8 50.2 18.8Q60.2 18.8 67.45 22.6Q74.7 26.4 78.7 33.4Q82.7 40.4 82.7 50Q82.7 59.5 78.7 66.55Q74.7 73.6 67.4 77.4Q60.1 81.2 50.1 81.2ZM50.1 65.2Q57 65.2 60.65 61.05Q64.3 56.9 64.3 49.9Q64.3 42.9 60.65 38.85Q57 34.8 50.1 34.8Q43.1 34.8 39.4 38.85Q35.7 42.9 35.7 49.9Q35.7 56.9 39.4 61.05Q43.1 65.2 50.1 65.2Z"/></svg></span>
        <svg class="hud-ring" viewBox="0 0 22 22"><circle class="track" cx="11" cy="11" r="9"/><circle class="fill" cx="11" cy="11" r="9" pathLength="100"/></svg>
        <span class="hud-dots"><i></i><i></i><i></i></span>
        <span class="hud-spark"><svg viewBox="0 0 16 16"><path d="M7 1.5C7.45 5.2 8.8 6.55 12.5 7 8.8 7.45 7.45 8.8 7 12.5 6.55 8.8 5.2 7.45 1.5 7 5.2 6.55 6.55 5.2 7 1.5Z"/><path d="M12.6 10.4c.2 1.4.75 1.95 2.15 2.15-1.4.2-1.95.75-2.15 2.15-.2-1.4-.75-1.95-2.15-2.15 1.4-.2 1.95-.75 2.15-2.15Z"/></svg></span>
        <span class="hud-caret"></span>
        <svg class="hud-check" viewBox="0 0 16 16"><path d="M3.4 8.6l3.1 3 6.1-6.6" pathLength="20"/></svg>
        <svg class="hud-alert" viewBox="0 0 16 16"><path d="M8 4.2v4.9M8 11.8v.1"/></svg>
        <svg class="hud-info" viewBox="0 0 16 16"><path d="M8 7.3v4.5M8 4.4v.1"/></svg>
        <span class="hud-badge"><svg viewBox="0 0 10 10"><path d="M3.2 4.3V3.2a1.8 1.8 0 0 1 3.6 0v1.1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="4.2" width="6" height="4.6" rx="1.3"/></svg></span>
      </span>
      <span class="hud-text"><span class="hud-label"></span><span class="hud-hint"></span></span>
      <span class="hud-meta"></span>
      <button class="hud-action" type="button" tabindex="-1" hidden>Retry</button>
      <button class="hud-close" type="button" tabindex="-1" aria-label="Cancel" title="Cancel (Esc)"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
      <span class="hud-progress" aria-hidden="true"><i></i></span>
    </div>
  </div>
</template>

<script src="hud-kit.js"></script>
<script>
'use strict';
const P = new URLSearchParams(location.search);
const FREEZE = P.has('freeze');

const PHRASE = 'Thanks for the notes. I will send the revised deck tonight and loop in Priya on the pricing slide';
const S = {
  loading:      { label: 'Downloading Parakeet', meta: '312 / 670 MB', progress: 0.466, close: false },
  'loading-indeterminate': { state: 'loading', label: 'Loading model', hint: 'first run only', close: false, indeterminate: true },
  idle:         { armed: true },
  recording:    { label: 'Listening', hint: 'release to insert', bubble: ['Thanks for the notes. I will send the', ' revised deck'], o: 1.22 },
  locked:       { label: 'Locked', hint: 'tap <kbd>Right Alt</kbd> to finish', bubble: ['Thanks for the notes. I will send the revised deck tonight and', ' loop in'], o: 1.16 },
  handsfree:    { label: 'Hands-free', hint: 'say “transcribe send”', bubble: ['Remind me to call the', ' dentist'], o: 1.12 },
  transcribing: { label: 'Transcribing', bubble: [PHRASE + '.', ''] },
  refining:     { label: 'Refining', hint: 'local · qwen3', close: true },
  inserting:    { label: 'Inserting', close: false },
  inserted:     { label: 'Inserted', hint: '19 words', meta: '0.42 s', close: false },
  error:        { label: 'Microphone unavailable. Check input settings.', action: 'Retry' },
  notice:       { label: 'Hands-free paused during your call' },
};
const ORDER = ['loading', 'loading-indeterminate', 'idle', 'recording', 'locked', 'handsfree', 'transcribing', 'refining', 'inserting', 'inserted', 'error', 'notice'];

function makeHud() { return document.getElementById('hud-tpl').content.firstElementChild.cloneNode(true); }

function paint(hud, key) {
  const d = S[key];
  const st = d.state || key;
  const q = (s) => hud.querySelector(s);
  hud.classList.toggle('is-indeterminate', !!d.indeterminate);
  hud.toggleAttribute('data-armed', !!d.armed);
  hud.style.setProperty('--progress', d.progress != null ? d.progress : 0);
  const apply = () => {
    q('.hud-label').textContent = d.label || '';
    q('.hud-hint').innerHTML = d.hint || '';
    q('.hud-meta').textContent = d.meta || '';
    q('.hud-action').hidden = !d.action;
    if (d.action) q('.hud-action').textContent = d.action;
    q('.hud-close').hidden = d.close === false;
    const b = q('.hud-bubble');
    b.hidden = !d.bubble;
    if (d.bubble) { q('.hud-final').textContent = d.bubble[0]; q('.hud-pending').textContent = d.bubble[1]; HudKit.fitBubble(b); }
  };
  HudKit.setState(hud, st, apply);
  if (d.o && FREEZE) HudKit.oSnapshot(hud.querySelector('.hud-o'), d.o);
}

function desk(theme) {
  const el = document.createElement('div');
  el.className = 'desk';
  el.dataset.theme = theme;
  el.innerHTML = '<div class="doc"><i class="h"></i>' + '<i></i>'.repeat(9) + '</div>';
  return el;
}

function addRow(key, label) {
  const rows = document.getElementById('rows');
  if (label) { const l = document.createElement('div'); l.className = 'row-label'; l.textContent = label; rows.append(l); }
  const row = document.createElement('div');
  row.className = 'row';
  const huds = [];
  for (const t of (P.get('theme') ? [P.get('theme')] : ['light', 'dark'])) {
    const d = desk(t); const h = makeHud(); d.append(h); row.append(d); huds.push(h);
  }
  rows.append(row);
  huds.forEach((h) => { paint(h, key); h.setAttribute('data-shown', ''); });
  return huds;
}

/* --------------------------------------------------------------- modes */
if (P.has('grid')) {
  document.body.classList.add('grid');
  ORDER.forEach((k) => addRow(k, k.replace('-', ' · ')));
} else if (P.get('state')) {
  document.body.classList.add('shot');
  addRow(P.get('state'));
} else {
  /* live: one session cycles through every state, with a synthetic voice driving the meter */
  const huds = addRow('idle');
  const meters = huds.map((h) => HudKit.oMeter(h.querySelector('.hud-o')));
  const bar = document.getElementById('bar');
  const btns = {};
  let timer = 0, voice = 0, words = 0, auto = true;

  function go(key) {
    clearInterval(voice);
    Object.entries(btns).forEach(([k, b]) => b.setAttribute('aria-pressed', String(k === key)));
    huds.forEach((h) => paint(h, key));
    const st = S[key].state || key;
    if (['recording', 'locked', 'handsfree'].includes(st)) {
      words = key === 'recording' ? 3 : 8;
      const speech = HudKit.fakeVoice(3), t0 = performance.now();
      voice = setInterval(() => {   // ~30 level events per second, like the core
        const rms = speech(performance.now() - t0);
        meters.forEach((m) => m.push(rms));
        if (Math.random() < 0.09) {
          words++;
          const all = PHRASE.split(' ');
          const fin = all.slice(0, Math.max(0, words - 2)).join(' ');
          const pend = all.slice(Math.max(0, words - 2), words).join(' ');
          huds.forEach((h) => {
            h.querySelector('.hud-final').textContent = fin;
            h.querySelector('.hud-pending').textContent = (fin ? ' ' : '') + pend;
            HudKit.fitBubble(h.querySelector('.hud-bubble'));
          });
        }
      }, 1000 / 30);
    } else {
      meters.forEach((m) => m.stop());
    }
    if (st === 'loading' && !S[key].indeterminate) {
      let p = 0.1;
      voice = setInterval(() => { p = Math.min(1, p + 0.035); huds.forEach((h) => h.style.setProperty('--progress', p)); }, 120);
    }
  }
  const SCRIPT = [['loading', 3200], ['loading-indeterminate', 1800], ['idle', 1600], ['recording', 5200], ['transcribing', 1500], ['refining', 2000], ['inserting', 500], ['inserted', 1800], ['locked', 3600], ['handsfree', 3600], ['error', 2600], ['notice', 2400]];
  let i = 0;
  function step() { if (!auto) return; const [k, ms] = SCRIPT[i++ % SCRIPT.length]; go(k); timer = setTimeout(step, ms); }
  for (const k of ORDER) {
    const b = document.createElement('button');
    b.textContent = k.replace('-indeterminate', ' ∞');
    b.onclick = () => { auto = false; clearTimeout(timer); go(k); play.setAttribute('aria-pressed', 'false'); };
    btns[k] = b; bar.append(b);
  }
  bar.append(Object.assign(document.createElement('span'), { className: 'sep' }));
  const play = document.createElement('button');
  play.textContent = 'Autoplay'; play.setAttribute('aria-pressed', 'true');
  play.onclick = () => { auto = !auto; play.setAttribute('aria-pressed', String(auto)); if (auto) step(); else clearTimeout(timer); };
  bar.append(play);
  step();
}
</script>
</body>
</html>
