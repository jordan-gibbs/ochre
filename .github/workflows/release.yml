# Builds installers and attaches them to a draft GitHub release.
#   - Push a tag `v*` (e.g. v0.1.0), or run it by hand (Actions → Release → Run workflow) to
#     get the installers as workflow artifacts without a release.
#   - Windows: NSIS setup .exe (per-user, bundles the VC++ runtime and DirectML.dll, see
#     app/src-tauri/tauri.bundle-windows.json). macOS: .dmg (Apple Silicon). Linux: .deb, .rpm + AppImage.
#   - Unsigned. macOS signing/notarization is picked up from the APPLE_* secrets once they exist
#     (Tauri reads APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID); without them the .dmg is unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-24.04 # ONNX Runtime's prebuilt library needs glibc 2.38+
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev \
            libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libxi-dev patchelf file

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Windows bundles DLLs from target/release (see scripts/stage-windows-redist.ps1), so the
      # binary is built first and the extra bundle config is passed only here.
      - name: Stage Windows DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p ochre-app
          ./scripts/stage-windows-redist.ps1
          "TAURI_EXTRA=--config tauri.bundle-windows.json" >> $env:GITHUB_ENV

      # Tauri treats a set-but-empty APPLE_* variable as "sign", so export only the ones that exist.
      - name: Apple signing secrets (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build installers
        working-directory: app/src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} $TAURI_EXTRA

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"

      - uses: actions/upload-artifact@v7
        with:
          name: ochre-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "Ochre $GITHUB_REF_NAME" --generate-notes
