[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jordan-gibbs/ochre"
rust-version = "1.88"

[workspace.dependencies]
ochre-core = { path = "crates/ochre-core" }
ochre-models = { path = "crates/ochre-models" }
ochre-audio = { path = "crates/ochre-audio" }
ochre-stt = { path = "crates/ochre-stt" }
ochre-cloud = { path = "crates/ochre-cloud" }
ochre-refine = { path = "crates/ochre-refine" }
ochre-platform = { path = "crates/ochre-platform" }
ochre-wake = { path = "crates/ochre-wake" }
ochre = { path = "crates/ochre" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3   # ort/ndarray/resampling are unusably slow unoptimized; our own crates stay debuggable
